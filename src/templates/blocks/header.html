{% load static %}

<header class="navbar">
  <!-- Brand (link to home ) -->
  <div class="nav-brand">
    <sl-tooltip content="Retour à l'accueil" placement="bottom">
      <a href="{% url 'warranty:home' %}">Garantix</a>
    </sl-tooltip>
  </div>

  <!-- Desktop menu -->
  <nav class="nav-desktop">
    <sl-button variant="text" href="{% url 'warranty:home' %}" class=" navbar-link">Accueil</sl-button>
    {% if user.is_authenticated %}
      <sl-button variant="text" href="{% url 'warranty:warranties_list' %}" class=" navbar-link">Mes garanties</sl-button>
      <sl-button variant="text" class="btn btn-white navbar-link" href="{% url 'accounts:logout' %}"  size="small">
        Se déconnecter
      </sl-button>
    {% else %}
      <sl-button href="{% url 'accounts:login' %}" class="btn btn-white navbar-link" size="small">
          Se connecter
      </sl-button>
    {% endif %}
  </nav>
  
  <!-- Mobile menu button -->
  <sl-button class="nav-mobile-toggle" variant="text" id="mobile-menu-btn">
    <sl-icon name="list"></sl-icon>
  </sl-button>
</header>

<!-- Mobile menu (caché par défaut) -->
<nav class="nav-mobile" id="mobile-menu">
  <sl-button variant="text" href="{% url 'warranty:home' %}" title="Accueil" class="mobile-link">Accueil</sl-button>
  {% if request.user.is_authenticated %}
  <sl-button variant="text" href="{% url 'warranty:warranties_list' %}" title="Mes garanties" class="mobile-link">Mes garanties</sl-button>
  <sl-button class="btn btn-white mobile-link" size="small" href="{% url 'accounts:logout' %}">Se déconnecter</sl-button>
  {% else %}
  <sl-button class="btn btn-white mobile-link" size="small" href="/admin/">Se connecter</sl-button>
  {% endif %}
</nav>


<script>

  document.addEventListener('DOMContentLoaded', () => {
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
  
    mobileMenuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('open');
      // icon burger menu 
      const icon = mobileMenuBtn.querySelector('sl-icon');
      if (mobileMenu.classList.contains('open')) {
        icon.name = 'x';
      } else {
        icon.name = 'list';
      }
    });
  
    const mobileLinks = mobileMenu.querySelectorAll('sl-button');

    mobileLinks.forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.classList.remove('open');
        mobileMenuBtn.querySelector('sl-icon').name = 'list';
      });
    });
  });
</script>
