<!-- 3 cards "features" in home page -->
<sl-card class="home-card custom-card">
  <div slot="header" class="card-header card-title">
    <strong class="card-home-title">{{ feature.title }}</strong>
    <small class="card-home-subtitle">{{ feature.subtitle }}</small>
  </div>
  <div class="card-body">
    <div class="info-row">
      <sl-icon name="{{ feature.icon }}" class="custom-card-icon"></sl-icon>
      <span>{{ feature.description }}</span>
    </div>
  </div>
</sl-card>
