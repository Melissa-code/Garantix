<!-- 3 cards "features" in home page -->
<sl-card class="home-card custom-card">
  <div slot="header" class="card-header card-title">
    <sl-icon name="archive" class="custom-card-icon"></sl-icon>
    <strong class="product-name card-home-title">{{ feature.title }}</strong>
  </div>
  <div class="card-body">
    <div class="info-row">
      <span>{{ feature.description }}</span>
    </div>
  </div>
</sl-card>
